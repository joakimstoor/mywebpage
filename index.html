<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiplikationstabellen ×</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #E9F5EE;
    --paper: #FFFFFF;
    --ink: #1F2A44;
    --soft: #5B6883;
    --line: #CFE3D8;
    --coral: #FF6B5B;
    --coral-shade: #D8483A;
    --sun: #FFC93C;
    --mint: #2FB67C;
    --pale-coral: #FFE7E3;
    --pale-mint: #DDF5E9;
    --accent: #6E56F0;
    --accent-shade: #4B36C4;
    --accent-pale: #ECE8FF;
    --display: "Baloo 2", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    padding-inline: 16px;
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(22px, 6vw, 40px);
    line-height: 1; margin: 0; letter-spacing: -0.01em;
  }
  h1 .x { color: var(--coral); }
  h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; line-height: 1.1; text-wrap: balance; }
  .muted { color: var(--soft); }
  .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); }
  .panel { background: var(--paper); border-radius: 22px; padding: 22px; box-shadow: 0 2px 0 var(--line); display: flex; flex-direction: column; gap: 18px; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .home-title { font: inherit; letter-spacing: inherit; padding: 0; border-radius: 10px; white-space: nowrap; text-align: left; }
  .home-title:hover .x { display: inline-block; transform: rotate(90deg); transition: transform .25s; }
  .head-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .scorepill {
    display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; font-weight: 800; font-size: 15px; color: #fff;
    box-shadow: 0 3px 0 rgba(31, 42, 68, 0.25); transition: transform .08s, box-shadow .08s;
  }
  .scorepill:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(31, 42, 68, 0.25); }
  .scorepill > span { display: flex; align-items: center; gap: 6px; padding: 7px 12px; }
  .scorepill b { font-family: var(--display); font-size: 19px; line-height: 1; font-variant-numeric: tabular-nums; }
  .sp-kids { background: linear-gradient(135deg, #C026D3, #FF7A45); padding-right: 18px !important; }
  .sp-rival { background: linear-gradient(135deg, #2563EB, #1E3A8A); padding-left: 18px !important; }
  .sp-bolt {
    padding: 0 !important; width: 0; position: relative; z-index: 1; justify-content: center; font-size: 22px;
    filter: drop-shadow(0 0 5px rgba(255, 225, 77, 0.9));
  }
  .big.versus {
    background: linear-gradient(115deg, #C026D3 0%, #FF7A45 48%, #2563EB 52%, #1E3A8A 100%);
    box-shadow: 0 5px 0 #1F2A44;
  }
  .big.versus:active { box-shadow: 0 1px 0 #1F2A44; }
  .who {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px;
    background: var(--paper); box-shadow: 0 2px 0 var(--line); font-weight: 800;
  }
  .who .av { font-size: 22px; line-height: 1; }
  .who small { color: var(--soft); font-weight: 700; }

  /* players */
  .players { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .pcard {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 8px 16px; border-radius: 20px;
    background: var(--paper); border: 3px solid var(--pc); box-shadow: 0 5px 0 var(--pc);
    transition: transform .08s, box-shadow .08s;
  }
  .pcard:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pc); }
  .pcard .av { font-size: clamp(40px, 12vw, 52px); line-height: 1.1; }
  .pcard .nm { font-family: var(--display); font-weight: 800; font-size: clamp(19px, 5.6vw, 26px); line-height: 1.1; color: var(--pc); }
  .pcard .st { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .players.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #rivalSlot { display: flex; justify-content: center; }
  .pcard.wide { flex-direction: row; gap: 12px; padding: 10px 20px 10px 12px; max-width: 100%; }
  .duo { display: flex; }
  .duo > span {
    width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; line-height: 1;
    background: var(--bub); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(15, 30, 77, 0.2);
  }
  .duo > span + span { margin-left: -14px; }
  .pcard.wide .txt { display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-width: 0; }
  .pcard.wide .nm { font-size: 22px; white-space: nowrap; }
  .pcard.wide .st { font-size: 16px; }
  .team-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .team-total { font-family: var(--display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
  /* arena: kids vs adults */
  .arena { border-radius: 26px; overflow: hidden; box-shadow: 0 6px 0 rgba(31, 42, 68, 0.18); background: #2563EB; }
  .side { display: flex; flex-direction: column; gap: 14px; padding: 22px; color: #fff; }
  .side.kids { background: linear-gradient(160deg, #C026D3 0%, #F0508A 45%, #FF7A45 100%); padding-bottom: 8px; }
  .side.rival { background: linear-gradient(180deg, #2563EB 0%, #1E3A8A 60%, #0F1E4D 100%); padding-top: 4px; }
  .side h2 { color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }
  .side .label { color: rgba(255, 255, 255, 0.85); }
  .side .team-head { margin-bottom: -4px; }
  .side .team-total { color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }
  .side .pcard { color: var(--ink); box-shadow: 0 5px 0 var(--pc), 0 10px 18px rgba(0, 0, 0, 0.18); }
  .seam { position: relative; height: 90px; display: grid; place-items: center; }
  .seam svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bolt { animation: flash 4s infinite; }
  @keyframes flash {
    0%, 86%, 100% { opacity: 1; }
    88% { opacity: .35; } 90% { opacity: 1; } 92% { opacity: .5; } 94% { opacity: 1; }
  }
  .vs {
    position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #FFF3B0, #FFD43B 50%, #F59E0B);
    color: #1F2A44; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 34px; line-height: 1;
    transform: rotate(-10deg);
    box-shadow: 0 0 0 5px #fff, 0 0 26px 8px rgba(255, 225, 77, 0.75);
  }
  .lead { text-align: center; font-weight: 800; color: #FFE14D; font-size: 18px; }
  .rival .sync { color: rgba(255, 255, 255, 0.75); }
  .rival .sync.ok { color: #86EFAC; }
  .rival .sync.off { color: #FECACA; }
  .sync { font-size: 14px; font-weight: 700; color: var(--soft); text-align: center; }
  .sync.ok { color: #16774D; }
  .sync.off { color: var(--coral-shade); }

  /* table picker */
  .tables { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tbl {
    aspect-ratio: 1; max-width: 100%; border-radius: 16px; font-family: var(--display); font-weight: 800; font-size: 28px;
    background: var(--ground); border: 2px solid var(--line); color: var(--soft);
    transition: transform .12s, background .12s, color .12s, border-color .12s;
  }
  .tbl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; transform: translateY(-2px); box-shadow: 0 4px 0 var(--accent-shade); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--ground); font-weight: 800; font-size: 15px; color: var(--soft); }
  .chip:hover { color: var(--ink); }
  .big {
    font-family: var(--display); font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 18px;
    background: var(--coral); color: #fff; box-shadow: 0 5px 0 var(--coral-shade); transition: transform .08s, box-shadow .08s;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--coral-shade); }
  .big[disabled] { background: var(--line); box-shadow: 0 5px 0 #B9D2C4; cursor: not-allowed; }
  .big.alt { background: var(--accent); box-shadow: 0 5px 0 var(--accent-shade); }
  .ghost { font-weight: 800; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); }
  .ghost:hover { border-color: var(--soft); }

  /* game */
  .scorebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .score { background: var(--paper); border-radius: 18px; padding: 10px 14px; display: flex; flex-direction: column; box-shadow: 0 2px 0 var(--line); }
  .score b { font-family: var(--display); font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .score.ok b { color: var(--mint); }
  .score.bad b { color: var(--coral); }
  .score.star b { color: #D99A00; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--ground); border: 2px solid var(--line); transition: background .2s, transform .2s; }
  .dot.on { background: var(--sun); border-color: #E7A800; transform: scale(1.08); }

  .question { text-align: center; }
  .q { font-family: var(--display); font-weight: 800; font-size: clamp(54px, 17vw, 88px); line-height: 1; font-variant-numeric: tabular-nums; }
  .q .op { color: var(--accent); }
  .answer {
    margin: 14px auto 0; min-height: 76px; width: min(220px, 100%); border-radius: 18px;
    border: 3px dashed var(--line); display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 48px; font-variant-numeric: tabular-nums;
    transition: background .15s, border-color .15s;
  }
  .answer.empty::after { content: "?"; color: var(--line); }
  .answer.right { background: var(--pale-mint); border: 3px solid var(--mint); color: var(--mint); }
  .answer.wrong { background: var(--pale-coral); border: 3px solid var(--coral); color: var(--coral); animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .feedback { min-height: 28px; text-align: center; font-weight: 800; font-size: 19px; }
  .feedback.good { color: var(--mint); }
  .feedback.bad { color: var(--coral); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key {
    padding-block: 14px; border-radius: 16px; background: var(--ground); font-family: var(--display); font-weight: 800; font-size: 28px;
    box-shadow: 0 3px 0 var(--line); transition: transform .06s, box-shadow .06s;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
  .key.ok { background: var(--mint); color: #fff; box-shadow: 0 3px 0 #1F8A5B; }
  .key.del { color: var(--soft); font-size: 22px; }
  .gamefoot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .modetag { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--accent-pale); color: var(--accent); }

  /* summary */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--ground); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-size: 36px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .total { padding: 14px 16px; border-radius: 16px; background: #FFF4D1; font-weight: 800; text-align: center; font-size: 18px; }
  .wrongs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .wrongs li {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 12px 16px; border-radius: 14px; background: var(--ground);
  }
  .wrongs .eq { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .wrongs .eq .res { color: var(--mint); }
  .wrongs .her { font-size: 14px; color: var(--soft); grid-column: 1; }
  .wrongs .times { grid-column: 2; grid-row: 1 / span 2; font-weight: 800; font-size: 13px; color: var(--coral); background: var(--pale-coral); padding: 4px 10px; border-radius: 999px; }
  .allgood { padding: 18px; border-radius: 16px; background: var(--pale-mint); color: #16774D; font-weight: 800; text-align: center; font-size: 19px; }

  /* celebration */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  .cheer {
    position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 16px;
    background: rgba(31, 42, 68, 0.35);
  }
  .cheer-card {
    background: var(--paper); border-radius: 28px; padding: 28px 34px; text-align: center; max-width: 100%;
    box-shadow: 0 10px 0 var(--sun); animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .cheer-emoji { font-size: 84px; line-height: 1; }
  .cheer-text { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 64px); line-height: 1.05; color: var(--accent); margin-top: 8px; }
  .cheer-sub { color: var(--soft); font-weight: 800; margin-top: 4px; }
  @keyframes pop { from { transform: scale(.4) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .cheer-card, .answer.wrong, .bolt { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><button type="button" class="home-title" id="homeTitle" aria-label="Till startsidan och ställningen">Multiplikationstabellen <span class="x">×</span></button></h1>
    <div class="head-right">
      <button class="scorepill" id="scorePill" type="button" hidden aria-label="Se ställningen">
        <span class="sp-kids">Barnen <b id="spKids">0</b></span>
        <span class="sp-bolt">⚡</span>
        <span class="sp-rival"><b id="spRival">0</b> Vuxna</span>
      </button>
      <button class="who" id="whoBtn" type="button" hidden aria-label="Byt spelare">
        <span class="av" id="whoAv">🦄</span><span id="whoName">Edda</span><small>byt</small>
      </button>
    </div>
  </header>

  <!-- PLAYERS -->
  <section id="players" class="arena">
    <div class="side kids">
      <h2>Vem spelar?</h2>
      <div class="team-head"><span class="label">Barnen</span><span class="team-total">⭐ <b id="teamStars">0</b></span></div>
      <div class="players" id="playerList"></div>
    </div>
    <div class="seam" aria-hidden="true">
      <svg viewBox="0 0 400 90" preserveAspectRatio="none">
        <defs>
          <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <polygon points="0,0 400,0 400,30 318,58 262,34 212,66 150,26 92,52 0,32" fill="#FF7A45"/>
        <polygon points="0,32 92,52 150,26 212,66 262,34 318,58 400,30 400,90 0,90" fill="#2563EB"/>
        <g class="bolt" filter="url(#glow)">
          <polyline points="0,32 92,52 150,26 212,66 262,34 318,58 400,30" fill="none" stroke="#FFE14D" stroke-width="10" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/>
          <polyline points="0,32 92,52 150,26 212,66 262,34 318,58 400,30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/>
        </g>
      </svg>
      <span class="vs">vs.</span>
    </div>
    <div class="side rival">
      <div class="lead" id="leadText"></div>
      <div id="rivalSlot"></div>
      <div class="sync" id="syncStatus">Hämtar stjärnor…</div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="setup" class="panel" hidden>
    <div>
      <h2 id="setupTitle">Hej Edda! Vilka tabeller vill du öva på?</h2>
      <p class="muted" style="margin:6px 0 0">Tryck på siffrorna för att välja.</p>
    </div>
    <div class="tables" id="tables"></div>
    <div class="row">
      <button class="chip" id="selAll" type="button">Välj alla</button>
      <button class="chip" id="selNone" type="button">Töm</button>
    </div>
    <button class="big" id="startBtn" type="button">Starta!</button>
  </section>

  <!-- GAME -->
  <section id="game" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="scorebar">
        <div class="score ok"><span class="label">Rätt</span><b id="okCount">0</b></div>
        <div class="score bad"><span class="label">Fel</span><b id="badCount">0</b></div>
        <div class="score star"><span class="label">Stjärnor</span><b id="starTotal">0</b></div>
      </div>
      <div class="panel">
        <div>
          <div class="label" style="margin-bottom:8px">Till nästa stjärna</div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="question">
          <div class="q" id="qText">3 <span class="op">×</span> 4</div>
          <div class="answer empty" id="answer" aria-live="polite"></div>
        </div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="pad" id="pad"></div>
      </div>
      <div class="gamefoot">
        <span class="modetag" id="modeTag">Tabeller: 2, 3</span>
        <button class="ghost" id="endBtn" type="button">Avsluta</button>
      </div>
    </div>
  </section>

  <!-- SUMMARY -->
  <section id="summary" class="panel" hidden>
    <h2 id="sumTitle">Bra jobbat!</h2>
    <div class="stats">
      <div class="stat"><span class="label">Rätt</span><b id="sumOk" style="color:var(--mint)">0</b></div>
      <div class="stat"><span class="label">Fel</span><b id="sumBad" style="color:var(--coral)">0</b></div>
      <div class="stat"><span class="label">Nya ⭐</span><b id="sumStars" style="color:#D99A00">0</b></div>
    </div>
    <div class="total" id="sumTotal">Totalt ⭐ 0 stjärnor</div>
    <div id="wrongWrap" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="row">
      <button class="big alt" id="practiceWrong" type="button">Öva på dem som blev fel</button>
      <button class="big" id="againBtn" type="button">Spela igen</button>
      <button class="big versus" id="standingBtn" type="button">⚡ Se ställningen</button>
    </div>
  </section>
</div>

<div class="cheer" id="cheer" hidden>
  <div class="cheer-card">
    <div class="cheer-emoji" id="cheerEmoji">🎉</div>
    <div class="cheer-text" id="cheerText">Super Edda!</div>
    <div class="cheer-sub" id="cheerSub">10 rätt till!</div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
/* ================================================================
   INSTÄLLNING: klistra in adressen till din Firebase Realtime
   Database mellan citattecknen, t.ex.
   "https://gangertabell-default-rtdb.europe-west1.firebasedatabase.app"
   Lämnas den tom sparas stjärnorna bara på den här enheten.
   ================================================================ */
const DATABASE_URL = "https://gangertabell-default-rtdb.europe-west1.firebasedatabase.app";

(() => {
  const $ = id => document.getElementById(id);
  const DB = DATABASE_URL.trim().replace(/\/+$/, "");
  const PLAYERS = [
    { name: "Edda",   emoji: "🦄", color: "#6E56F0", shade: "#4B36C4", pale: "#ECE8FF" },
    { name: "Ember",  emoji: "🐉", color: "#E4572E", shade: "#B53B18", pale: "#FFE6DC" },
    { name: "Olivia", emoji: "🌸", color: "#D6337F", shade: "#A71F5E", pale: "#FFE3F0" },
    { name: "Jocke",  label: "Jocke & Emilia", emoji: "🧑‍🏫🤾‍♀️", avatars: ["🧑‍🏫", "🤾‍♀️"], color: "#0E7C74", shade: "#095A54", pale: "#D9F2EF", rival: true },
  ];
  const EMOJIS = ["🎉","🥳","🌟","🦄","🌈","😄","🤩","🐱","🐶","🍭","🎈","💖","🐬","🦋","🍓","🚀","👑","🐼","🌻","😺","🏆","✨","🐸","🍦"];
  const FIELDS = ["stars", "ok", "bad", "games"];

  // ---------- storage helpers ----------
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const blank = () => ({ stars: 0, ok: 0, bad: 0, games: 0 });

  let totals = load("gt-totals", {});    // what we show (server + not-yet-sent)
  let pending = load("gt-pending", {});  // increments not yet saved online
  PLAYERS.forEach(p => { totals[p.name] = Object.assign(blank(), totals[p.name]); pending[p.name] = Object.assign(blank(), pending[p.name]); });

  // ---------- online sync (Firebase Realtime Database, REST) ----------
  function setSync(text, cls) { const s = $("syncStatus"); s.textContent = text; s.className = "sync" + (cls ? " " + cls : ""); }

  async function refreshTotals() {
    if (!DB) { setSync("Stjärnorna sparas bara på den här enheten."); renderPlayers(); return; }
    try {
      await flush();
      const r = await fetch(DB + "/players.json", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const data = (await r.json()) || {};
      PLAYERS.forEach(p => {
        const srv = data[p.name] || {}, pen = pending[p.name];
        FIELDS.forEach(f => totals[p.name][f] = (Number(srv[f]) || 0) + (pen[f] || 0));
      });
      save("gt-totals", totals);
      setSync("✓ Stjärnorna sparas på nätet", "ok");
    } catch (e) {
      setSync("Ingen kontakt med nätet – stjärnorna sparas när nätet är tillbaka.", "off");
    }
    renderPlayers();
  }

  let flushing = false, flushTimer = 0;
  function scheduleFlush() { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1200); }
  async function flush() {
    if (!DB) { PLAYERS.forEach(p => pending[p.name] = blank()); save("gt-pending", pending); return; }
    if (flushing) return;
    flushing = true;
    try {
      for (const p of PLAYERS) {
        const pen = pending[p.name];
        const sent = {}; const body = {};
        FIELDS.forEach(f => { if (pen[f]) { sent[f] = pen[f]; body[f] = { ".sv": { increment: pen[f] } }; } });
        if (!Object.keys(body).length) continue;
        const r = await fetch(DB + "/players/" + encodeURIComponent(p.name) + ".json", {
          method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: true
        });
        if (!r.ok) throw new Error(r.status);
        FIELDS.forEach(f => { if (sent[f]) pending[p.name][f] -= sent[f]; });
        save("gt-pending", pending);
      }
    } catch (e) { /* try again later */ }
    flushing = false;
  }
  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

  function bump(field, n = 1) {
    if (!player) return;
    totals[player.name][field] += n; pending[player.name][field] += n;
    save("gt-totals", totals); save("gt-pending", pending);
    updatePill();
    scheduleFlush();
  }

  // ---------- players ----------
  let player = null;
  function renderPlayers() {
    const list = $("playerList"); list.innerHTML = "";
    const slot = $("rivalSlot"); slot.innerHTML = "";
    let team = 0, rival = 0;
    PLAYERS.forEach(p => {
      if (p.rival) rival += totals[p.name].stars; else team += totals[p.name].stars;
      const b = document.createElement("button");
      b.type = "button"; b.className = "pcard" + (p.rival ? " wide" : ""); b.style.setProperty("--pc", p.color);
      const stars = '<span class="st">⭐ ' + totals[p.name].stars + '</span>';
      const nm = '<span class="nm">' + (p.label || p.name) + '</span>';
      b.innerHTML = p.avatars
        ? '<span class="duo">' + p.avatars.map((a, i) => '<span style="--bub:' + ["#D9F2EF", "#FFEBD1"][i % 2] + '">' + a + '</span>').join("") + '</span><span class="txt">' + nm + stars + '</span>'
        : '<span class="av">' + p.emoji + '</span>' + nm + stars;
      b.addEventListener("click", () => choosePlayer(p));
      (p.rival ? slot : list).appendChild(b);
    });
    $("teamStars").textContent = team;
    const diff = team - rival;
    $("leadText").textContent = diff > 0 ? "Barnen leder med " + diff + " ⭐"
      : diff < 0 ? "De vuxna leder med " + (-diff) + " ⭐ – kom igen barn!"
      : "Oavgjort – vem tar ledningen?";
  }
  function choosePlayer(p) {
    player = p;
    const r = document.documentElement.style;
    r.setProperty("--accent", p.color); r.setProperty("--accent-shade", p.shade); r.setProperty("--accent-pale", p.pale);
    $("whoAv").textContent = p.emoji; $("whoName").textContent = p.label || p.name; $("whoBtn").hidden = false;
    selected = new Set(load("gt-tables-" + p.name, [2, 3, 4, 5]));
    $("setupTitle").textContent = "Hej " + (p.label || p.name) + "! Vilka tabeller vill du öva på?";
    show("setup"); renderTables();
  }
  function goHome() {
    player = null; $("whoBtn").hidden = true; show("players"); refreshTotals();
  }
  $("homeTitle").onclick = goHome;
  $("scorePill").onclick = goHome;
  $("standingBtn").onclick = goHome;
  $("whoBtn").onclick = () => {
    player = null; $("whoBtn").hidden = true; show("players"); refreshTotals();
  };
  function show(id) {
    ["players", "setup", "game", "summary"].forEach(s => $(s).hidden = s !== id);
    $("scorePill").hidden = id === "players";
    updatePill();
  }
  function updatePill() {
    let kids = 0, rival = 0;
    PLAYERS.forEach(p => { if (p.rival) rival += totals[p.name].stars; else kids += totals[p.name].stars; });
    $("spKids").textContent = kids; $("spRival").textContent = rival;
  }

  // ---------- setup ----------
  let selected = new Set([2, 3, 4, 5]);
  const tablesEl = $("tables");
  for (let n = 1; n <= 10; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tbl"; b.textContent = n; b.id = "tbl" + n;
    b.addEventListener("click", () => { selected.has(n) ? selected.delete(n) : selected.add(n); renderTables(); });
    tablesEl.appendChild(b);
  }
  function renderTables() {
    for (let n = 1; n <= 10; n++) $("tbl" + n).setAttribute("aria-pressed", selected.has(n));
    $("startBtn").disabled = selected.size === 0;
    $("startBtn").textContent = selected.size ? "Starta!" : "Välj minst en tabell";
    if (player) save("gt-tables-" + player.name, [...selected]);
  }
  $("selAll").onclick = () => { for (let n = 1; n <= 10; n++) selected.add(n); renderTables(); };
  $("selNone").onclick = () => { selected.clear(); renderTables(); };
  $("startBtn").onclick = () => startGame(null);

  // ---------- keypad ----------
  const pad = $("pad");
  ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "key" + (k === "OK" ? " ok" : k === "⌫" ? " del" : "");
    b.textContent = k; b.setAttribute("aria-label", k === "⌫" ? "Sudda" : k === "OK" ? "Svara" : k);
    b.addEventListener("click", () => press(k));
    pad.appendChild(b);
  });
  document.addEventListener("keydown", e => {
    if ($("game").hidden) return;
    if (!$("cheer").hidden) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hideCheer(); } return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("⌫");
    else if (e.key === "Enter") { e.preventDefault(); press("OK"); }
  });

  let ok = 0, bad = 0, streakToTen = 0, stars = 0;
  let current = null, typed = "", locked = false, lastKey = "";
  let wrongs = new Map();
  let practiceQueue = null;

  function press(k) {
    if (locked) return;
    if (k === "⌫") typed = typed.slice(0, -1);
    else if (k === "OK") { if (typed) check(); return; }
    else if (typed.length < 3) typed += k;
    drawAnswer();
  }
  function drawAnswer(cls) {
    const a = $("answer");
    a.className = "answer" + (typed ? "" : " empty") + (cls ? " " + cls : "");
    a.textContent = typed;
  }

  // ---------- game ----------
  function startGame(queue) {
    practiceQueue = queue;
    if (!queue) { ok = 0; bad = 0; streakToTen = 0; stars = 0; wrongs = new Map(); }
    bump("games");
    show("game");
    $("modeTag").textContent = queue
      ? "Övar på felen: " + queue.length + " kvar"
      : "Tabeller: " + [...selected].sort((a, b) => a - b).join(", ");
    updateScore(); nextQuestion();
  }

  function nextQuestion() {
    typed = ""; locked = false; $("feedback").textContent = ""; $("feedback").className = "feedback";
    if (practiceQueue) {
      if (!practiceQueue.length) { endGame(true); return; }
      current = practiceQueue[0];
      $("modeTag").textContent = "Övar på felen: " + practiceQueue.length + " kvar";
    } else {
      const tabs = [...selected];
      let a, b, key, tries = 0;
      do {
        const t = tabs[Math.floor(Math.random() * tabs.length)];
        const f = 1 + Math.floor(Math.random() * 10);
        [a, b] = Math.random() < 0.5 ? [f, t] : [t, f];
        key = Math.min(a, b) + "×" + Math.max(a, b);
      } while (key === lastKey && tries++ < 20);
      lastKey = key;
      current = { a, b };
    }
    $("qText").innerHTML = current.a + ' <span class="op">×</span> ' + current.b;
    drawAnswer();
  }

  function check() {
    locked = true;
    const val = parseInt(typed, 10), right = current.a * current.b;
    const fb = $("feedback");
    if (val === right) {
      ok++; streakToTen++; bump("ok");
      drawAnswer("right");
      fb.textContent = ["Rätt!", "Snyggt!", "Jättebra!", "Precis!", "Ja!"][Math.floor(Math.random() * 5)];
      fb.className = "feedback good";
      if (practiceQueue) practiceQueue.shift();
      if (streakToTen >= 10) {
        streakToTen = 0; stars++; bump("stars");
        updateScore();
        setTimeout(celebrate, 450);
      } else { updateScore(); setTimeout(nextQuestion, 700); }
    } else {
      bad++; bump("bad");
      const key = current.a + "×" + current.b;
      if (!wrongs.has(key)) wrongs.set(key, { a: current.a, b: current.b, answers: [] });
      wrongs.get(key).answers.push(val);
      drawAnswer("wrong");
      fb.textContent = "Inte riktigt – " + current.a + " × " + current.b + " = " + right;
      fb.className = "feedback bad";
      if (practiceQueue) practiceQueue.push(practiceQueue.shift());
      updateScore();
      setTimeout(nextQuestion, 2000);
    }
  }

  function updateScore() {
    $("okCount").textContent = ok; $("badCount").textContent = bad;
    $("starTotal").textContent = player ? totals[player.name].stars : 0;
    const d = $("dots"); d.innerHTML = "";
    for (let i = 0; i < 10; i++) {
      const s = document.createElement("span");
      s.className = "dot" + (i < streakToTen ? " on" : "");
      d.appendChild(s);
    }
  }

  // ---------- celebration ----------
  function celebrate() {
    $("cheerEmoji").textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    $("cheerText").textContent = "Super " + (player.label || player.name) + "!";
    $("cheerSub").textContent = "Du har nu ⭐ " + totals[player.name].stars + " stjärnor! Tryck för att fortsätta";
    $("cheer").hidden = false;
    confetti();
  }
  function hideCheer() {
    if ($("cheer").hidden) return;
    $("cheer").hidden = true; nextQuestion();
  }
  $("cheer").addEventListener("click", hideCheer);

  const cv = $("confetti"), cx = cv.getContext("2d");
  let parts = [], raf = 0;
  function confetti() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const colors = ["#FF6B5B", "#FFC93C", "#6E56F0", "#2FB67C", "#3FA9F5", "#FF8FC7"];
    const n = reduce ? 60 : 220;
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? -10 : innerWidth + 10, y: innerHeight * (0.55 + Math.random() * 0.35),
        vx: (fromLeft ? 1 : -1) * (5 + Math.random() * 9), vy: -(10 + Math.random() * 12),
        w: 7 + Math.random() * 7, h: 10 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[i % colors.length], life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
    for (const p of parts) {
      p.life++; p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      const s = Math.abs(Math.cos(p.r * 2));
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2 * s, p.w, p.h * s + 1);
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  // ---------- end / summary ----------
  $("endBtn").onclick = () => endGame(false);
  function endGame(practiceDone) {
    flush();
    show("summary");
    $("sumOk").textContent = ok; $("sumBad").textContent = bad; $("sumStars").textContent = stars;
    $("sumTitle").textContent = practiceDone ? "Alla fel är rättade – super, " + (player.label || player.name) + "!" : "Bra jobbat, " + (player.label || player.name) + "!";
    const t = totals[player.name];
    $("sumTotal").textContent = "Totalt har du samlat ⭐ " + t.stars + (t.stars === 1 ? " stjärna" : " stjärnor");
    const items = [...wrongs.values()];
    const ww = $("wrongWrap");
    if (!items.length) {
      ww.innerHTML = ok ? '<div class="allgood">Inga fel alls! 🌟</div>' : "";
      $("practiceWrong").hidden = true;
    } else {
      ww.innerHTML = '<div class="label">De här blev fel – så här är det rätt</div><ul class="wrongs" id="wrongList"></ul>';
      const ul = $("wrongList");
      items.sort((x, y) => x.a - y.a || x.b - y.b).forEach(w => {
        const li = document.createElement("li");
        li.innerHTML =
          '<span class="eq">' + w.a + ' × ' + w.b + ' = <span class="res">' + (w.a * w.b) + '</span></span>' +
          '<span class="times">' + w.answers.length + (w.answers.length === 1 ? " gång" : " gånger") + '</span>' +
          '<span class="her">Du svarade ' + w.answers.join(", ") + '</span>';
        ul.appendChild(li);
      });
      $("practiceWrong").hidden = practiceDone;
    }
  }
  $("practiceWrong").onclick = () => {
    const q = [...wrongs.values()].map(w => ({ a: w.a, b: w.b }));
    for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
    wrongs = new Map(); ok = 0; bad = 0; streakToTen = 0; stars = 0;
    startGame(q);
  };
  $("againBtn").onclick = () => show("setup");

  renderPlayers();
  refreshTotals();
})();
</script>
</body>
</html>
