<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Multiplikation med Enhörningar 🦄</title>

<style>
    body {
        font-family: "Comic Sans MS", "Arial Rounded MT Bold", sans-serif;
        background: linear-gradient(135deg,
            #ff9a9e,
            #fad0c4,
            #fbc2eb,
            #a6c1ee);
        min-height: 100vh;
        margin: 0;
        color: #4a004a;
        overflow-x: hidden;
    }

    .layout {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding: 30px;
    }

    .container {
        background: rgba(255,255,255,0.88);
        width: 400px;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
    }

    .sidebar {
        background: rgba(255,255,255,0.88);
        padding: 20px;
        border-radius: 20px;
        min-width: 160px;
        height: fit-content;
    }

    .question {
        font-size: 2.5em;
        margin: 20px 0;
    }

    input[type="number"] {
        font-size: 1.5em;
        padding: 10px;
        width: 100px;
        border-radius: 10px;
        border: 2px solid #d36cff;
        text-align: center;
    }

    button {
        font-size: 1.2em;
        padding: 10px 25px;
        margin: 15px;
        background: #ff6ec7;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }

    .result {
        font-size: 1.3em;
        min-height: 2em;
    }

    .unicorns {
        font-size: 2em;
    }

    .score {
        margin-top: 10px;
        font-size: 1.1em;
    }

    /* --- SUPER EDDA --- */
    .super-edda {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.9);
        display: none;
        justify-content: center;
        align-items: center;
        font-size: 4em;
        color: #ff2da8;
        z-index: 10;
        flex-direction: column;
        animation: pop 0.6s ease-out;
    }

    @keyframes pop {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* --- CONFETTI --- */
    .confetti {
        position: fixed;
        top: -10px;
        width: 10px;
        height: 10px;
        opacity: 0.8;
        animation: fall linear forwards;
        z-index: 9;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(720deg);
        }
    }
</style>
</head>

<body>

<div class="layout">

    <div class="container">
        <div class="unicorns">🦄 🌈 🦄 🌈 🦄</div>
        <h1>Multiplikationstest</h1>

        <div class="question" id="question"></div>

        <input type="number" id="answer" placeholder="?" />
        <br>
        <button onclick="checkAnswer()">Svara</button>

        <div class="result" id="result"></div>

        <div class="score">
            Poäng: <span id="score">0</span><br>
            Rätt i rad: <span id="streak">0</span>
        </div>
    </div>

    <div class="sidebar">
        <h2>Välj tabeller</h2>
        <div id="tabs">
            <label><input type="checkbox" value="1" checked> 1‑ans</label>
            <label><input type="checkbox" value="2" checked> 2‑ans</label>
            <label><input type="checkbox" value="3" checked> 3‑ans</label>
            <label><input type="checkbox" value="4" checked> 4‑ans</label>
            <label><input type="checkbox" value="5" checked> 5‑ans</label>
            <label><input type="checkbox" value="6" checked> 6‑ans</label>
            <label><input type="checkbox" value="7" checked> 7‑ans</label>
            <label><input type="checkbox" value="8" checked> 8‑ans</label>
            <label><input type="checkbox" value="9" checked> 9‑ans</label>
            <label><input type="checkbox" value="10" checked> 10‑ans</label>
        </div>
    </div>

</div>

<div class="super-edda" id="superEdda">
    🌟 SUPER EDDA! 🌟
</div>

<script>
    let a, b;
    let score = 0;
    let streak = 0;

    const answerInput = document.getElementById("answer");

    // ENTER = svara
    answerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            checkAnswer();
        }
    });

    function selectedTables() {
        return [...document.querySelectorAll('#tabs input:checked')]
            .map(x => Number(x.value));
    }

    function newQuestion() {
        const tabs = selectedTables();
        if (tabs.length === 0) {
            document.getElementById("question").textContent =
                "Välj minst en tabell 🌈";
            return;
        }
        a = tabs[Math.floor(Math.random() * tabs.length)];
        b = Math.floor(Math.random() * 10) + 1;
        document.getElementById("question").textContent = `${a} × ${b} = ?`;
        answerInput.value = "";
        answerInput.focus();
    }

    function checkAnswer() {
        if (answerInput.value === "") return;

        const correct = a * b;
        const user = Number(answerInput.value);

        if (user === correct) {
            score++;
            streak++;
            document.getElementById("result").textContent =
                "✅ Rätt!";
            if (streak === 10) {
                celebrate();
                streak = 0;
            }
        } else {
            streak = 0;
            document.getElementById("result").textContent =
                `🌟 Rätt svar är ${correct}`;
        }

        document.getElementById("score").textContent = score;
        document.getElementById("streak").textContent = streak;

        setTimeout(newQuestion, 1200);
    }

    function celebrate() {
        document.getElementById("superEdda").style.display = "flex";
        createConfetti();

        setTimeout(() => {
            document.getElementById("superEdda").style.display = "none";
        }, 2500);
    }

    function createConfetti() {
        for (let i = 0; i < 150; i++) {
            const conf = document.createElement("div");
            conf.className = "confetti";
            conf.style.left = Math.random() * 100 + "vw";
            conf.style.background =
                `hsl(${Math.random() * 360},90%,60%)`;
            conf.style.animationDuration =
                2 + Math.random() * 2 + "s";
            document.body.appendChild(conf);

            setTimeout(() => conf.remove(), 4000);
        }
    }

    newQuestion();
</script>

</body>
</html>
