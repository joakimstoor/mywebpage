<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Eddas gångertabell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #E9F5EE;
    --paper: #FFFFFF;
    --ink: #1F2A44;
    --soft: #5B6883;
    --line: #CFE3D8;
    --coral: #FF6B5B;
    --sun: #FFC93C;
    --grape: #6E56F0;
    --mint: #2FB67C;
    --pale-grape: #ECE8FF;
    --pale-coral: #FFE7E3;
    --pale-mint: #DDF5E9;
    --display: "Baloo 2", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    padding-inline: 16px;
    padding-block: 20px 32px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8vw, 42px);
    line-height: 1; margin: 0; letter-spacing: -0.01em;
  }
  h1 .x { color: var(--coral); }
  h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; line-height: 1.1; text-wrap: balance; }
  .muted { color: var(--soft); }
  .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); }
  .panel { background: var(--paper); border-radius: 22px; padding: 22px; box-shadow: 0 2px 0 var(--line); display: flex; flex-direction: column; gap: 18px; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }

  /* table picker */
  .tables { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tbl {
    aspect-ratio: 1; max-width: 100%; border-radius: 16px; font-family: var(--display); font-weight: 800; font-size: 28px;
    background: var(--ground); border: 2px solid var(--line); color: var(--soft);
    transition: transform .12s, background .12s, color .12s, border-color .12s;
  }
  .tbl[aria-pressed="true"] { background: var(--grape); border-color: var(--grape); color: #fff; transform: translateY(-2px); box-shadow: 0 4px 0 #4B36C4; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--ground); font-weight: 800; font-size: 15px; color: var(--soft); }
  .chip:hover { color: var(--ink); }
  .big {
    font-family: var(--display); font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 18px;
    background: var(--coral); color: #fff; box-shadow: 0 5px 0 #D8483A; transition: transform .08s, box-shadow .08s;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #D8483A; }
  .big[disabled] { background: var(--line); box-shadow: 0 5px 0 #B9D2C4; cursor: not-allowed; }
  .big.alt { background: var(--grape); box-shadow: 0 5px 0 #4B36C4; }
  .ghost { font-weight: 800; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); }
  .ghost:hover { border-color: var(--soft); }

  /* game */
  .scorebar { display: flex; gap: 10px; align-items: stretch; }
  .score { flex: 1; background: var(--paper); border-radius: 18px; padding: 10px 14px; display: flex; flex-direction: column; box-shadow: 0 2px 0 var(--line); }
  .score b { font-family: var(--display); font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .score.ok b { color: var(--mint); }
  .score.bad b { color: var(--coral); }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--ground); border: 2px solid var(--line); transition: background .2s, transform .2s; }
  .dot.on { background: var(--sun); border-color: #E7A800; transform: scale(1.08); }

  .question { text-align: center; padding-block: 8px 0; }
  .q { font-family: var(--display); font-weight: 800; font-size: clamp(54px, 17vw, 88px); line-height: 1; font-variant-numeric: tabular-nums; }
  .q .op { color: var(--grape); }
  .answer {
    margin: 14px auto 0; min-height: 76px; width: min(220px, 100%); border-radius: 18px;
    border: 3px dashed var(--line); display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 48px; font-variant-numeric: tabular-nums;
    transition: background .15s, border-color .15s;
  }
  .answer.empty::after { content: "?"; color: var(--line); }
  .answer.right { background: var(--pale-mint); border: 3px solid var(--mint); color: var(--mint); }
  .answer.wrong { background: var(--pale-coral); border: 3px solid var(--coral); color: var(--coral); animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .feedback { min-height: 28px; text-align: center; font-weight: 800; font-size: 19px; }
  .feedback.good { color: var(--mint); }
  .feedback.bad { color: var(--coral); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key {
    padding-block: 14px; border-radius: 16px; background: var(--ground); font-family: var(--display); font-weight: 800; font-size: 28px;
    box-shadow: 0 3px 0 var(--line); transition: transform .06s, box-shadow .06s;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
  .key.ok { background: var(--mint); color: #fff; box-shadow: 0 3px 0 #1F8A5B; }
  .key.del { color: var(--soft); font-size: 22px; }
  .gamefoot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .modetag { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--pale-grape); color: var(--grape); }

  /* summary */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--ground); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-size: 36px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .wrongs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .wrongs li {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 12px 16px; border-radius: 14px; background: var(--ground);
  }
  .wrongs .eq { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .wrongs .eq .res { color: var(--mint); }
  .wrongs .her { font-size: 14px; color: var(--soft); grid-column: 1; }
  .wrongs .times { grid-column: 2; grid-row: 1 / span 2; font-weight: 800; font-size: 13px; color: var(--coral); background: var(--pale-coral); padding: 4px 10px; border-radius: 999px; }
  .allgood { padding: 18px; border-radius: 16px; background: var(--pale-mint); color: #16774D; font-weight: 800; text-align: center; font-size: 19px; }

  /* celebration */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  .cheer {
    position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 16px;
    background: rgba(31, 42, 68, 0.35);
  }
  .cheer-card {
    background: var(--paper); border-radius: 28px; padding: 28px 34px; text-align: center; max-width: 100%;
    box-shadow: 0 10px 0 var(--sun); animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .cheer-emoji { font-size: 84px; line-height: 1; }
  .cheer-text { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 64px); line-height: 1.05; color: var(--grape); margin-top: 8px; }
  .cheer-sub { color: var(--soft); font-weight: 800; margin-top: 4px; }
  @keyframes pop { from { transform: scale(.4) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .cheer-card, .answer.wrong { animation: none; }
    * { transition: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Gånger<span class="x">×</span>tabellen</h1>
    <span class="muted" style="font-weight:800">för Edda</span>
  </header>

  <!-- SETUP -->
  <section id="setup" class="panel">
    <div>
      <h2>Vilka tabeller vill du öva på?</h2>
      <p class="muted" style="margin:6px 0 0">Tryck på siffrorna för att välja.</p>
    </div>
    <div class="tables" id="tables"></div>
    <div class="row">
      <button class="chip" id="selAll" type="button">Välj alla</button>
      <button class="chip" id="selNone" type="button">Töm</button>
    </div>
    <button class="big" id="startBtn" type="button">Starta!</button>
  </section>

  <!-- GAME -->
  <section id="game" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="scorebar">
        <div class="score ok"><span class="label">Rätt</span><b id="okCount">0</b></div>
        <div class="score bad"><span class="label">Fel</span><b id="badCount">0</b></div>
      </div>
      <div class="panel">
        <div>
          <div class="label" style="margin-bottom:8px">Till nästa överraskning</div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="question">
          <div class="q" id="qText">3 <span class="op">×</span> 4</div>
          <div class="answer empty" id="answer" aria-live="polite"></div>
        </div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="pad" id="pad"></div>
      </div>
      <div class="gamefoot">
        <span class="modetag" id="modeTag">Tabeller: 2, 3</span>
        <button class="ghost" id="endBtn" type="button">Avsluta</button>
      </div>
    </div>
  </section>

  <!-- SUMMARY -->
  <section id="summary" class="panel" hidden>
    <h2 id="sumTitle">Bra jobbat, Edda!</h2>
    <div class="stats">
      <div class="stat"><span class="label">Rätt</span><b id="sumOk" style="color:var(--mint)">0</b></div>
      <div class="stat"><span class="label">Fel</span><b id="sumBad" style="color:var(--coral)">0</b></div>
      <div class="stat"><span class="label">Stjärnor</span><b id="sumStars" style="color:#E7A800">0</b></div>
    </div>
    <div id="wrongWrap" style="display:flex;flex-direction:column;gap:10px">
      <div class="label">De här blev fel – så här är det rätt</div>
      <ul class="wrongs" id="wrongList"></ul>
    </div>
    <div class="row">
      <button class="big alt" id="practiceWrong" type="button">Öva på dem som blev fel</button>
      <button class="big" id="againBtn" type="button">Spela igen</button>
    </div>
  </section>
</div>

<div class="cheer" id="cheer" hidden>
  <div class="cheer-card">
    <div class="cheer-emoji" id="cheerEmoji">🎉</div>
    <div class="cheer-text">Super Edda!</div>
    <div class="cheer-sub" id="cheerSub">10 rätt till!</div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const EMOJIS = ["🎉","🥳","🌟","🦄","🌈","😄","🤩","🐱","🐶","🍭","🎈","💖","🐬","🦋","🍓","🚀","👑","🐼","🌻","😺","🏆","✨","🐸","🍦"];

  // ---------- state ----------
  let selected = new Set([2, 3, 4, 5]);
  try {
    const s = JSON.parse(localStorage.getItem("edda-tables") || "null");
    if (Array.isArray(s) && s.length) selected = new Set(s);
  } catch (e) {}

  let ok = 0, bad = 0, streakToTen = 0, stars = 0;
  let current = null, typed = "", locked = false, lastKey = "";
  let wrongs = new Map();   // key "a×b" -> {a,b,answers:[]}
  let practiceQueue = null; // array of {a,b} when practicing mistakes

  // ---------- setup ----------
  const tablesEl = $("tables");
  for (let n = 1; n <= 10; n++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tbl"; b.textContent = n; b.id = "tbl" + n;
    b.addEventListener("click", () => { selected.has(n) ? selected.delete(n) : selected.add(n); renderTables(); });
    tablesEl.appendChild(b);
  }
  function renderTables() {
    for (let n = 1; n <= 10; n++) $("tbl" + n).setAttribute("aria-pressed", selected.has(n));
    $("startBtn").disabled = selected.size === 0;
    $("startBtn").textContent = selected.size ? "Starta!" : "Välj minst en tabell";
    try { localStorage.setItem("edda-tables", JSON.stringify([...selected])); } catch (e) {}
  }
  $("selAll").onclick = () => { for (let n = 1; n <= 10; n++) selected.add(n); renderTables(); };
  $("selNone").onclick = () => { selected.clear(); renderTables(); };
  $("startBtn").onclick = () => startGame(null);
  renderTables();

  // ---------- keypad ----------
  const pad = $("pad");
  ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "key" + (k === "OK" ? " ok" : k === "⌫" ? " del" : "");
    b.textContent = k; b.setAttribute("aria-label", k === "⌫" ? "Sudda" : k === "OK" ? "Svara" : k);
    b.addEventListener("click", () => press(k));
    pad.appendChild(b);
  });
  document.addEventListener("keydown", e => {
    if ($("game").hidden) return;
    if (!$("cheer").hidden) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hideCheer(); } return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("⌫");
    else if (e.key === "Enter") { e.preventDefault(); press("OK"); }
  });

  function press(k) {
    if (locked) return;
    if (k === "⌫") typed = typed.slice(0, -1);
    else if (k === "OK") { if (typed) check(); return; }
    else if (typed.length < 3) typed += k;
    drawAnswer();
  }
  function drawAnswer(cls) {
    const a = $("answer");
    a.className = "answer" + (typed ? "" : " empty") + (cls ? " " + cls : "");
    a.textContent = typed;
  }

  // ---------- game ----------
  function startGame(queue) {
    practiceQueue = queue;
    if (!queue) { ok = 0; bad = 0; streakToTen = 0; stars = 0; wrongs = new Map(); }
    $("setup").hidden = true; $("summary").hidden = true; $("game").hidden = false;
    $("modeTag").textContent = queue
      ? "Övar på felen: " + queue.length + " kvar"
      : "Tabeller: " + [...selected].sort((a, b) => a - b).join(", ");
    updateScore(); nextQuestion();
  }

  function nextQuestion() {
    typed = ""; locked = false; $("feedback").textContent = ""; $("feedback").className = "feedback";
    if (practiceQueue) {
      if (!practiceQueue.length) { endGame(true); return; }
      current = practiceQueue[0];
      $("modeTag").textContent = "Övar på felen: " + practiceQueue.length + " kvar";
    } else {
      const tabs = [...selected];
      let a, b, key, tries = 0;
      do {
        const t = tabs[Math.floor(Math.random() * tabs.length)];
        const f = 1 + Math.floor(Math.random() * 10);
        [a, b] = Math.random() < 0.5 ? [f, t] : [t, f];
        key = Math.min(a, b) + "×" + Math.max(a, b);
      } while (key === lastKey && tries++ < 20);
      lastKey = key;
      current = { a, b };
    }
    $("qText").innerHTML = current.a + ' <span class="op">×</span> ' + current.b;
    drawAnswer();
  }

  function check() {
    locked = true;
    const val = parseInt(typed, 10), right = current.a * current.b;
    const fb = $("feedback");
    if (val === right) {
      ok++; streakToTen++;
      drawAnswer("right");
      fb.textContent = ["Rätt!", "Snyggt!", "Jättebra!", "Precis!", "Ja!"][Math.floor(Math.random() * 5)];
      fb.className = "feedback good";
      if (practiceQueue) practiceQueue.shift();
      updateScore();
      if (streakToTen >= 10) {
        streakToTen = 0; stars++;
        setTimeout(() => { updateScore(); celebrate(); }, 450);
      } else setTimeout(nextQuestion, 700);
    } else {
      bad++;
      const key = current.a + "×" + current.b;
      if (!wrongs.has(key)) wrongs.set(key, { a: current.a, b: current.b, answers: [] });
      wrongs.get(key).answers.push(val);
      drawAnswer("wrong");
      fb.textContent = "Inte riktigt – " + current.a + " × " + current.b + " = " + right;
      fb.className = "feedback bad";
      if (practiceQueue) practiceQueue.push(practiceQueue.shift()); // try again later
      updateScore();
      setTimeout(nextQuestion, 2000);
    }
  }

  function updateScore() {
    $("okCount").textContent = ok; $("badCount").textContent = bad;
    const d = $("dots"); d.innerHTML = "";
    for (let i = 0; i < 10; i++) {
      const s = document.createElement("span");
      s.className = "dot" + (i < streakToTen ? " on" : "");
      d.appendChild(s);
    }
  }

  // ---------- celebration ----------
  function celebrate() {
    $("cheerEmoji").textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    $("cheerSub").textContent = ok + " rätt hittills! Tryck för att fortsätta";
    $("cheer").hidden = false;
    confetti();
  }
  function hideCheer() {
    if ($("cheer").hidden) return;
    $("cheer").hidden = true; nextQuestion();
  }
  $("cheer").addEventListener("click", hideCheer);

  const cv = $("confetti"), cx = cv.getContext("2d");
  let parts = [], raf = 0;
  function confetti() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const colors = ["#FF6B5B", "#FFC93C", "#6E56F0", "#2FB67C", "#3FA9F5", "#FF8FC7"];
    const n = reduce ? 60 : 220;
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? -10 : innerWidth + 10, y: innerHeight * (0.55 + Math.random() * 0.35),
        vx: (fromLeft ? 1 : -1) * (5 + Math.random() * 9), vy: -(10 + Math.random() * 12),
        w: 7 + Math.random() * 7, h: 10 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[i % colors.length], life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
    for (const p of parts) {
      p.life++; p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.r * 2)), p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  // ---------- end / summary ----------
  $("endBtn").onclick = () => endGame(false);
  function endGame(practiceDone) {
    $("game").hidden = true; $("summary").hidden = false;
    $("sumOk").textContent = ok; $("sumBad").textContent = bad; $("sumStars").textContent = stars;
    $("sumTitle").textContent = practiceDone ? "Alla fel är rättade – super, Edda!" : ok ? "Bra jobbat, Edda!" : "Vi ses snart igen, Edda!";
    const items = [...wrongs.values()];
    const ww = $("wrongWrap");
    if (!items.length) {
      ww.innerHTML = '<div class="allgood">Inga fel alls! 🌟</div>';
      $("practiceWrong").hidden = true;
    } else {
      ww.innerHTML = '<div class="label">De här blev fel – så här är det rätt</div><ul class="wrongs" id="wrongList"></ul>';
      const ul = $("wrongList");
      items.sort((x, y) => x.a - y.a || x.b - y.b).forEach(w => {
        const li = document.createElement("li");
        li.innerHTML =
          '<span class="eq">' + w.a + ' × ' + w.b + ' = <span class="res">' + (w.a * w.b) + '</span></span>' +
          '<span class="times">' + w.answers.length + (w.answers.length === 1 ? " gång" : " gånger") + '</span>' +
          '<span class="her">Du svarade ' + w.answers.join(", ") + '</span>';
        ul.appendChild(li);
      });
      $("practiceWrong").hidden = practiceDone;
    }
  }
  $("practiceWrong").onclick = () => {
    const q = [...wrongs.values()].map(w => ({ a: w.a, b: w.b }));
    for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
    wrongs = new Map(); ok = 0; bad = 0; streakToTen = 0; stars = 0;
    startGame(q);
  };
  $("againBtn").onclick = () => { $("summary").hidden = true; $("setup").hidden = false; };
})();
</script>

</body></html>
